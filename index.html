<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow RPG</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #0a0b10;
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            padding-bottom: 75px;
            background-image: linear-gradient(to bottom, rgba(10, 11, 16, 0.45), rgba(10, 11, 16, 0.92)), url('./bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body.blood-mode {
            background-image: linear-gradient(to bottom, rgba(25, 5, 5, 0.5), rgba(10, 5, 5, 0.94)), url('./червоний.png');
        }

        .header {
            padding: 12px 16px;
            background: rgba(13, 15, 23, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 20;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #8a2be2;
            overflow: hidden;
            background: #1a1033;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rank-badge {
            background: #1c2d42;
            color: #4da6ff;
            border: 1px solid #4da6ff;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .resources {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-end;
        }

        .res-pill {
            background: rgba(22, 27, 41, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .gold { color: #f5b041; }
        .energy { color: #5dade2; }

        .exp-bar {
            text-align: right;
            font-size: 11px;
            color: #a0aab5;
            padding: 4px 16px;
            background: rgba(10, 11, 16, 0.85);
            position: relative;
            z-index: 20;
        }

        .main-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .tab-section {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .tab-section.active {
            display: flex;
        }

        .hero-artwork {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(138, 43, 226, 0.45);
            background: rgba(5, 5, 10, 0.7);
            min-height: 220px;
            max-height: 340px;
        }

        .hero-artwork img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gate-info {
            margin-top: auto;
        }

        .gate-subtitle {
            color: #3498db;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .gate-subtitle.blood {
            color: #e74c3c;
        }

        .gate-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 14px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        button {
            touch-action: manipulation;
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(90deg, #0088cc, #00aaff);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            display: block;
        }

        .btn-primary:active {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: rgba(33, 38, 56, 0.95);
            color: #ffffff;
            border: 1px solid #3c445c;
            padding: 14px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-danger {
            background: #922b21;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            width: 100%;
            margin-top: 12px;
            font-weight: 600;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: #131622;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .modal-box h3 {
            margin-bottom: 10px;
        }

        .modal-box p {
            color: #a0aab5;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
        }

        .battle-card {
            background: rgba(19, 22, 34, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .monster-box {
            width: 100%;
            height: 180px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(231, 76, 60, 0.45);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .monster-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .hp-bar {
            width: 100%;
            height: 10px;
            background: #2c3e50;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 6px;
        }

        .hp-fill {
            height: 100%;
            background: #e74c3c;
            transition: width 0.3s;
        }

        .battle-log {
            background: rgba(8, 9, 13, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            padding: 10px;
            height: 100px;
            overflow-y: auto;
            font-size: 13px;
            color: #e2e8f0;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .attack-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: auto;
        }

        .dungeon-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .dungeon-item {
            background: rgba(19, 22, 34, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            color: #ffffff;
            width: 100%;
        }

        .dungeon-item.selected {
            border-color: #0099ff;
            background: rgba(0, 153, 255, 0.18);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: #0d1018;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: #8b949e;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 4px;
            padding: 6px 10px;
        }

        .nav-item.active {
            color: #0099ff;
        }

        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="profile-info">

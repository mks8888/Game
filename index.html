<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow RPG</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-dark: #0a0b10;
            --card-bg: #131622;
            --accent-blue: #0099ff;
            --accent-purple: #8a2be2;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --border-color: #212638;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Верхняя панель */
        .header {
            padding: 12px 16px;
            background: rgba(19, 22, 34, 0.95);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--accent-purple);
            background: #1a1033;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .rank-badge {
            background: #1c2d42;
            color: #4da6ff;
            border: 1px solid #4da6ff;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .resources {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-end;
        }

        .res-pill {
            background: #161b29;
            border: 1px solid var(--border-color);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .gold { color: #f5b041; border-color: rgba(245, 176, 65, 0.3); }
        .energy { color: #5dade2; border-color: rgba(93, 173, 226, 0.3); }

        .exp-bar {
            text-align: right;
            font-size: 11px;
            color: var(--text-muted);
            padding: 4px 16px;
            background: #0d0f17;
        }

        /* Основной контент */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-bottom: 80px;
        }

        .tab-section {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .tab-section.active {
            display: flex;
        }

        /* Главный экран */
        .hero-artwork {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            border-radius: 12px;
            background: radial-gradient(circle, rgba(138,43,226,0.2) 0%, rgba(10,11,16,1) 75%);
            border: 1px solid rgba(138, 43, 226, 0.3);
            position: relative;
            min-height: 220px;
        }

        .hero-placeholder {
            text-align: center;
            color: #a569bd;
        }

        .hero-placeholder span {
            font-size: 64px;
            display: block;
            filter: drop-shadow(0 0 15px #8a2be2);
        }

        .gate-info {
            margin-top: auto;
        }

        .gate-subtitle {
            color: #3498db;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .gate-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 14px;
        }

        /* Кнопки (Фикс кликабельности) */
        .btn-primary {
            width: 100%;
            background: linear-gradient(90deg, #0088cc, #00aaff);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            position: relative;
            z-index: 20;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #212638;
            color: white;
            border: 1px solid #30364d;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-danger {
            background: #922b21;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .modal-box h3 { margin-bottom: 10px; }
        .modal-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button { flex: 1; }

        /* Экран боя */
        .battle-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .hp-bar {
            width: 100%;
            height: 10px;
            background: #2c3e50;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 6px;
        }

        .hp-fill {
            height: 100%;
            background: #e74c3c;
            transition: width 0.3s;
        }

        .battle-log {
            background: #08090d;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            height: 130px;
            overflow-y: auto;
            font-size: 13px;
            color: #d0d7de;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .attack-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0d1018;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 50;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-blue);
        }

        .nav-icon { font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="profile-info">
            <div class="avatar">🗡️</div>
            <div>
                <div style="font-weight: 700;">Охотник</div>
                <div style="font-size: 12px; color: var(--text-muted);">
                    УР. <strong style="color: white;" id="ui-lvl">1</strong>
                    <span class="rank-badge">E</span>
                </div>
            </div>
        </div>
        <div class="resources">
            <div class="res-pill gold">Золото: <span id="ui-gold">500</span></div>
            <div class="res-pill energy">Энергия: <span id="ui-energy">80</span>/80</div>
        </div>
    </div>
    <div class="exp-bar">
        Опыт: <span id="ui-exp">0</span> / 5000
    </div>

    <div class="main-content">
        
        <div id="tab-home" class="tab-section active">
            <div class="hero-artwork">
                <div class="hero-placeholder">
                    <span>🌑</span>
                    <div style="font-size: 12px; margin-top: 8px;">Теневой Охотник</div>
                </div>
            </div>

            <div class="gate-info">
                <div class="gate-subtitle">ТЁМНЫЕ ВРАТА ОТКРЫТЫ</div>
                <div class="gate-title">Подземелье Бездны</div>
                <button type="button" class="btn-primary" id="btn-open-gate">Войти во Врата</button>
            </div>
        </div>

        <div id="tab-gates" class="tab-section">
            <div class="battle-card">
                <div style="display: flex; justify-content: space-between;">
                    <strong>Страж Бездны</strong>

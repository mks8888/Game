   <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow RPG</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-dark: #0a0b10;
            --card-bg: rgba(19, 22, 34, 0.9);
            --accent-blue: #0099ff;
            --accent-purple: #8a2be2;
            --text-main: #ffffff;
            --text-muted: #a0aab5;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
        }

        /* Синий фон на главном экране (bg.png) */
        body {
            display: flex;
            flex-direction: column;
            padding-bottom: 72px;
            background-image: linear-gradient(to bottom, rgba(10, 11, 16, 0.55), rgba(10, 11, 16, 0.92)), url('bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.4s ease;
        }

        /* Красный фон во время боя в Вратах (червоний.png) */
        body.battle-mode {
            background-image: linear-gradient(to bottom, rgba(15, 5, 5, 0.6), rgba(10, 5, 5, 0.92)), url('червоний.png');
        }

        /* Верхняя панель */
        .header {
            padding: 12px 16px;
            background: rgba(13, 15, 23, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--accent-purple);
            overflow: hidden;
            background: #000;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rank-badge {
            background: #1c2d42;
            color: #4da6ff;
            border: 1px solid #4da6ff;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .resources {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-end;
        }

        .res-pill {
            background: rgba(22, 27, 41, 0.9);
            border: 1px solid var(--border-color);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .gold { color: #f5b041; border-color: rgba(245, 176, 65, 0.35); }
        .energy { color: #5dade2; border-color: rgba(93, 173, 226, 0.35); }

        .exp-bar {
            text-align: right;
            font-size: 11px;
            color: var(--text-muted);
            padding: 4px 16px;
            background: rgba(10, 11, 16, 0.75);
        }

        /* Основной контент */
        .main-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .tab-section {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .tab-section.active {
            display: flex;
        }

        /* Картинка героя (герой.jpg) */
        .hero-artwork {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(138, 43, 226, 0.45);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.25);
            background: #000;
            max-height: 360px;
        }

        .hero-artwork img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gate-info {
            margin-top: auto;
        }

        .gate-subtitle {
            color: #3498db;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .gate-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 14px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        /* Кнопки */
        button {
            touch-action: manipulation;
            cursor: pointer;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(90deg, #0088cc, #00aaff);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 153, 255, 0.35);
        }

        .btn-primary:active {
            opacity: 0.85;
            transform: scale(0.98);
        }

        .btn-secondary {
            background: rgba(33, 38, 56, 0.95);
            color: white;
            border: 1px solid #3c445c;
            padding: 14px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-danger {
            background: #922b21;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            width: 100%;
            margin-top: 12px;
            font-weight: 600;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: #131622;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .modal-box h3 { margin-bottom: 10px; }
        .modal-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button { flex: 1; }

        /* Экран боя и монстр (гоблін.png) */
        .battle-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .monster-box {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(231, 76, 60, 0.45);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .monster-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .hp-bar {
            width: 100%;
            height: 10px;
            background: #2c3e50;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 6px;
        }

        .hp-fill {
            height: 100%;
            background: #e74c3c;
            transition: width 0.3s;
        }

        .battle-log {
            background: rgba(8, 9, 13, 0.92);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            height: 105px;
            overflow-y: auto;
            font-size: 13px;
            color: #e2e8f0;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .attack-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: auto;
        }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: #0d1018;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 4px;
            padding: 6px 10px;
        }

        .nav-item.active {
            color: var(--accent-blue);
        }

        .nav-icon { font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="profile-info">
            <div class="avatar">
                <img src="герой.jpg" alt="Охотник">
            </div>
            <div>
                <div style="font-weight: 700;">Охотник</div>
                <div style="font-size: 12px; color: var(--text-muted);">
                    УР. <strong style="color: white;" id="ui-lvl">1</strong>

<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shadow Monarch RPG</title>
<script src="https://telegram.org"></script>
<style>
:root{--bg:#060911;--card:#0d1322;--b-blue:#1b365d;--neon:#00a8ff;--purp:#9b59b6;--red:#d90429;--txt:#f1f5f9;--mut:#64748b}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ВЕРХНЯ ПАНЕЛЬ (АВАТАРКА ЗЛІВА + БАЛАНС СПРАВА) */
.top-bar{padding:12px 14px;background:rgba(6,9,17,0.88);backdrop-filter:blur(8px);border-bottom:1px solid #132038;z-index:20}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.profile-left{display:flex;align-items:center;gap:10px}
.ava-ring{width:50px;height:50px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--neon),var(--purp));box-shadow:0 0 12px rgba(155,89,182,0.5);flex-shrink:0}
.ava-inner{width:100%;height:100%;border-radius:50%;background:#090d16;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ava-inner img{width:100%;height:100%;object-fit:cover}
.rank-box{display:inline-flex;align-items:center;justify-content:center;padding:1px 6px;background:#0c1e38;border:1px solid var(--neon);color:var(--neon);border-radius:4px;font-weight:800;font-size:11px;margin-left:4px}

.bal-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bal-pill{background:var(--card);border:1px solid var(--b-blue);border-radius:20px;padding:4px 10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}

.xp-bar{width:100%;height:4px;background:#1e293b;border-radius:2px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#00a8ff);width:0%;transition:width .3s}

/* ЦЕНТРАЛЬНА ОБЛАСТЬ З ТВОЇМ ФОНОМ */
.content{flex:1;position:relative;overflow-y:auto;padding-bottom:66px;display:flex;flex-direction:column}
.bg-layer{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0.85}
.bg-vignette{position:fixed;inset:0;background:linear-gradient(180deg,rgba(6,9,17,0.7) 0%,rgba(6,9,17,0.15) 50%,rgba(6,9,17,0.95) 92%);z-index:1;pointer-events:none}

.home-wrap{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
.btn-main{width:100%;padding:14px;border:none;border-radius:10px;background:linear-gradient(90deg,#0284c7,#00a8ff);box-shadow:0 4px 20px rgba(0,168,255,0.45);color:#fff;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.5px}
.btn-main:active{transform:scale(0.97)}

/* ВКЛАДКИ (ВРАТА ТА ІНШІ) */
.tab-page{position:relative;z-index:5;padding:14px}
.card{background:rgba(13,19,34,0.9);backdrop-filter:blur(6px);border:1px solid var(--b-blue);border-radius:12px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden}
.d-blood{border:1px solid var(--red);background:linear-gradient(135deg,rgba(31,6,11,0.92) 0%,rgba(13,19,34,0.92) 85%);box-shadow:0 0 16px rgba(217,4,41,0.35)}
.blood-fx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 90% 15%,rgba(217,4,41,0.5) 0%,transparent 24%),radial-gradient(circle at 82% 8%,rgba(160,0,20,0.6) 0%,transparent 12%)}
.drip{position:absolute;top:0;right:26px;width:4px;height:30px;background:var(--red);border-radius:0 0 4px 4px;box-shadow:0 0 8px var(--red)}
.btn-blood{background:linear-gradient(90deg,#800f2f,#d90429);box-shadow:0 4px 14px rgba(217,4,41,0.4)}

/* НИЖНЯ ПАНЕЛЬ ПЕРЕХОДІВ */
.nav{position:fixed;bottom:0;left:0;right:0;height:62px;background:#050811;border-top:1px solid #162238;display:grid;grid-template-columns:repeat(5,1fr);z-index:30}
.n-item{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);font-size:10px;font-weight:600;cursor:pointer;gap:4px}
.n-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.n-item.active{color:var(--neon)}
.n-item.active svg{filter:drop-shadow(0 0 6px var(--neon))}

/* ВІКНО БОЮ */
#b-modal{display:none;position:fixed;inset:0;background:rgba(4,6,12,0.96);z-index:90;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.boss-circle{width:170px;height:170px;border-radius:50%;border:2px solid var(--red);background:radial-gradient(circle,#38040e,#090204);box-shadow:0 0 35px rgba(217,4,41,0.55);display:flex;align-items:center;justify-content:center;margin:20px auto;cursor:pointer;overflow:hidden}
.boss-circle:active{transform:scale(0.9)}
.boss-circle img{width:100%;height:100%;object-fit:cover}
.hp-wrap{width:85%;max-width:300px;height:10px;background:#1a0508;border-radius:5px;overflow:hidden;border:1px solid #590d22;margin:10px auto}
.hp-fill{height:100%;background:linear-gradient(90deg,#800f2f,#ff0a54);width:100%;transition:width .15s}
.hidden{display:none!important}
</style>
</head>
<body>

<img src="bg.png" class="bg-layer" id="main-bg" onerror="this.style.display='none'">
<div class="bg-vignette"></div>

<div class="top-bar">
  <div class="top-row">
    <div class="profile-left">
      <div class="ava-ring">
        <div class="ava-inner">
          <img src="avatar.png" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <svg style="display:none;width:26px;height:26px;stroke:#9b59b6;fill:none;stroke-width:1.6" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7v4l-2 3v2h18v-2l-2-3V9a7 7 0 0 0-7-7z"/><circle cx="9.5" cy="10" r="1" fill="#00a8ff"/><circle cx="14.5" cy="10" r="1" fill="#00a8ff"/></svg>
        </div>
      </div>
      <div>
        <div style="font-weight:800;font-size:15px" id="u-name">Мисливець</div>
        <div style="font-size:11px;color:#94a3b8">РІВ. <b style="color:#fff" id="lvl">1</b> <span class="rank-box" id="rank">E</span></div>
      </div>
    </div>

    <div class="bal-right">
      <div class="bal-pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="#f59e0b"><circle cx="12" cy="12" r="9"/></svg><span id="gold">500</span></div>
      <div class="bal-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="#eab308"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span id="en">80</span>/80</div>
    </div>
  </div>
  <div class="xp-bar"><div class="xp-fill" id="xp-bar"></div></div>
  <div style="font-size:10px;color:#94a3b8;margin-top:3px;text-align:right">Досвід: <span id="xp">0</span> / <span id="xp-max">5000</span></div>
</div>

<div class="content">
  <div class="home-wrap" id="t-home">
    <div style="color:var(--neon);font-size:11px;font-weight:800;letter-spacing:1.2px;margin-bottom:4px">ТЕМНІ ВРАТА ВІДКРИТІ</div>
    <h2 style="font-size:22px;margin-bottom:6px;text-shadow:0 2px 10px #000">Підземелля Безодні</h2>
    <p style="font-size:12px;color:#cbd5e1;margin-bottom:14px">Обери рівень небезпеки та здобудь силу.</p>
    <button class="btn-main" onclick="tab('gates')">Увійти у Врата</button>
  </div>

  <div class="tab-page hidden" id="t-gates">
    <div style="font-size:11px;color:#cbd5e1;letter-spacing:1px;margin-bottom:10px;font-weight:700">ОБЕРІТЬ РІВЕНЬ ПІДЗЕМЕЛЛЯ</div>
    <div id="dungeons-list"></div>
  </div>

  <div class="tab-page hidden" id="t-other">
    <div class="card" style="text-align:center;padding:25px 15px">
      <h3 style="margin-bottom:8px">Спорядження та Навички</h3>
      <p style="font-size:12px;color:var(--mut);margin-bottom:14px">Розділ готовий для додавання предметів та зброї.</p>
      <button class="btn-main" style="background:#162238;border:1px solid var(--b-blue);box-shadow:none" onclick="localStorage.removeItem('rpgMainV1');location.reload()">Скинути прогрес</button>
    </div>
  </div>
</div>

<div class="nav">
  <div class="n-item active" id="n-home" onclick="tab('home')"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Головна</div>
  <div class="n-item" id="n-gates" onclick="tab('gates')"><svg viewBox="0 0 24 24"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4"/></svg>Врата</div>
  <div class="n-item" onclick="tab('other')"><svg viewBox="0 0 24 24"><path d="M12 2L4 7v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V7l-8-5z"/></svg>Арена</div>
  <div class="n-item" onclick="tab('other')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/></svg>Мисливець</div>
  <div class="n-item" id="n-other" onclick="tab('other')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Ще</div>
</div>

<div id="b-modal">
  <div style="color:var(--red);font-size:11px;font-weight:800;letter-spacing:1.5px" id="b-lvl">ПІДЗЕМЕЛЛЯ</div>
  <h2 id="b-name" style="margin:8px 0">Бос</h2>
  <div class="hp-wrap"><div class="hp-fill" id="b-hp"></div></div>
  <div class="boss-circle" onclick="hitBoss()">
    <img src="boss.png" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">

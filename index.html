<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shadow Monarch RPG</title>
<script src="https://telegram.org"></script>
<style>
:root{--bg:#060911;--card:#0d1322;--b-blue:#1b365d;--neon:#00a8ff;--purp:#9b59b6;--red:#d90429;--txt:#f1f5f9;--mut:#64748b}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',Roboto,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ШАПКА */
.top-bar{padding:12px 14px;background:rgba(6,9,17,0.88);backdrop-filter:blur(8px);border-bottom:1px solid #132038;z-index:20}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.profile-left{display:flex;align-items:center;gap:10px}
.ava-ring{width:50px;height:50px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--neon),var(--purp));box-shadow:0 0 12px rgba(155,89,182,0.5);flex-shrink:0}
.ava-inner{width:100%;height:100%;border-radius:50%;background:#090d16;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ava-inner img{width:100%;height:100%;object-fit:cover}
.rank-box{display:inline-flex;align-items:center;justify-content:center;padding:1px 6px;background:#0c1e38;border:1px solid var(--neon);color:var(--neon);border-radius:4px;font-weight:800;font-size:11px;margin-left:4px}
.bal-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bal-pill{background:var(--card);border:1px solid var(--b-blue);border-radius:20px;padding:4px 10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.xp-bar{width:100%;height:4px;background:#1e293b;border-radius:2px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#00a8ff);width:0%;transition:width .3s}

/* КОНТЕНТ ТА ФОН */
.content{flex:1;position:relative;overflow-y:auto;padding-bottom:68px;display:flex;flex-direction:column}
.bg-layer{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0.85}
.bg-vignette{position:fixed;inset:0;background:linear-gradient(180deg,rgba(6,9,17,0.7) 0%,rgba(6,9,17,0.15) 50%,rgba(6,9,17,0.96) 92%);z-index:1;pointer-events:none}
.home-wrap{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
.tab-page{position:relative;z-index:5;padding:14px}

.btn-main{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(90deg,#0284c7,#00a8ff);box-shadow:0 4px 16px rgba(0,168,255,0.4);color:#fff;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-main:active{transform:scale(0.97)}
.btn-main:disabled{opacity:0.4;pointer-events:none}
.card{background:rgba(13,19,34,0.92);backdrop-filter:blur(6px);border:1px solid var(--b-blue);border-radius:12px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden}
.d-blood{border:1px solid var(--red);background:linear-gradient(135deg,rgba(31,6,11,0.94) 0%,rgba(13,19,34,0.94) 85%)}
.btn-blood{background:linear-gradient(90deg,#800f2f,#d90429);box-shadow:0 4px 14px rgba(217,4,41,0.4)}

/* МОДАЛЬНІ ВІКНА (ПІДТВЕРДЖЕННЯ / НАВЧАННЯ / БІЙ) */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(4,6,12,0.94);backdrop-filter:blur(6px);z-index:90;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.modal-box{background:linear-gradient(180deg,#111827,#090d16);border:1px solid var(--neon);box-shadow:0 0 25px rgba(0,168,255,0.25);border-radius:16px;padding:20px;width:100%;max-width:360px}

/* БОЙОВА АРЕНА */
.battle-screen{display:none;position:fixed;inset:0;background:#05070d;z-index:95;flex-direction:column;justify-content:space-between;padding:16px}
.battle-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.35;z-index:0}
.battle-ui{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;justify-content:space-between}
.hp-box{background:rgba(13,19,34,0.9);border:1px solid #1e293b;border-radius:10px;padding:10px;margin-bottom:8px}
.hp-bar{width:100%;height:10px;background:#1e293b;border-radius:5px;overflow:hidden;margin-top:6px}
.hp-enemy{height:100%;background:linear-gradient(90deg,#991b1b,#ef4444);width:100%;transition:width .25s}
.hp-player{height:100%;background:linear-gradient(90deg,#0284c7,#38bdf8);width:100%;transition:width .25s}
.enemy-art{width:150px;height:150px;border-radius:50%;border:2px solid var(--red);margin:6px auto;overflow:hidden;background:#1a0508;box-shadow:0 0 30px rgba(217,4,41,0.5);display:flex;align-items:center;justify-content:center}
.enemy-art img{width:100%;height:100%;object-fit:cover}
.log-box{background:rgba(6,9,17,0.85);border:1px solid #1e3a5f;border-radius:8px;padding:10px;font-size:12px;color:#e2e8f0;min-height:54px;display:flex;align-items:center;justify-content:center;text-align:center;margin:8px 0}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act-btn{padding:11px 8px;border-radius:10px;border:1px solid #1e3a5f;background:#0f172a;color:#fff;font-weight:700;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.act-btn:active{transform:scale(0.95)}
.act-btn:disabled{opacity:0.35;pointer-events:none}
.act-sub{font-size:10px;color:#94a3b8;font-weight:400}

/* НИЖНЯ НАВІГАЦІЯ */
.nav{position:fixed;bottom:0;left:0;right:0;height:62px;background:#050811;border-top:1px solid #162238;display:grid;grid-template-columns:repeat(5,1fr);z-index:30}
.n-item{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);font-size:10px;font-weight:600;cursor:pointer;gap:4px}
.n-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.n-item.active{color:var(--neon)}
.hidden{display:none!important}
</style>
</head>
<body>

<img src="bg.png" class="bg-layer" id="main-bg" onerror="this.style.display='none'">
<div class="bg-vignette"></div>

<div class="top-bar">
  <div class="top-row">
    <div class="profile-left">
      <div class="ava-ring">
        <div class="ava-inner">
          <img src="avatar.png" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <svg style="display:none;width:26px;height:26px;stroke:#9b59b6;fill:none;stroke-width:1.6" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7v4l-2 3v2h18v-2l-2-3V9a7 7 0 0 0-7-7z"/><circle cx="9.5" cy="10" r="1" fill="#00a8ff"/><circle cx="14.5" cy="10" r="1" fill="#00a8ff"/></svg>
        </div>
      </div>
      <div>
        <div style="font-weight:800;font-size:15px" id="u-name">Мисливець</div>
        <div style="font-size:11px;color:#94a3b8">РІВ. <b style="color:#fff" id="lvl">1</b> <span class="rank-box" id="rank">E</span></div>
      </div>
    </div>
    <div class="bal-right">
      <div class="bal-pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="#f59e0b"><circle cx="12" cy="12" r="9"/></svg><span id="gold">500</span></div>
      <div class="bal-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="#eab308"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span id="en">80</span>/80</div>
    </div>
  </div>
  <div class="xp-bar"><div class="xp-fill" id="xp-bar"></div></div>
  <div style="font-size:10px;color:#94a3b8;margin-top:3px;text-align:right">Досвід: <span id="xp">0</span> / <span id="xp-max">5000</span></div>
</div>

<div class="content">
  <div class="home-wrap" id="t-home">
    <div style="color:var(--neon);font-size:11px;font-weight:800;letter-spacing:1.2px;margin-bottom:4px">ТЕМНІ ВРАТА ВІДКРИТІ</div>
    <h2 style="font-size:22px;margin-bottom:6px;text-shadow:0 2px 10px #000">Підземелля Безодні</h2>
    <p style="font-size:12px;color:#cbd5e1;margin-bottom:14px">Зачисти врата, щоб пробудити силу клинка.</p>
    <button class="btn-main" onclick="askEnterGate()">Увійти у Врата</button>
  </div>

  <div class="tab-page hidden" id="t-gates">
    <div style="font-size:11px;color:#cbd5e1;letter-spacing:1px;margin-bottom:10px;font-weight:700">ОБЕРІТЬ РІВЕНЬ ПІДЗЕМЕЛЛЯ</div>
    <div id="dungeons-list"></div>
  </div>

  <div class="tab-page hidden" id="t-other">
    <div class="card" style="text-align:center;padding:25px 15px">
      <h3 style="margin-bottom:8px">Спорядження та Навички</h3>
      <p style="font-size:12px;color:var(--mut);margin-bottom:14px">Тут з'явиться прокачка характеристик та зброї.</p>
      <button class="btn-main" style="background:#162238;border:1px solid var(--b-blue);box-shadow:none" onclick="localStorage.removeItem('rpgCombatV1');location.reload()">Скинути прогрес та навчання</button>
    </div>
  </div>
</div>

<div class="nav">
  <div class="n-item active" id="n-home" onclick="switchTab('home')"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Головна</div>
  <div class="n-item" id="n-gates" onclick="switchTab('gates')"><svg viewBox="0 0 24 24"><path d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4"/></svg>Врата</div>
  <div class="n-item" onclick="switchTab('other')"><svg viewBox="0 0 24 24"><path d="M12 2L4 7v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V7l-8-5z"/></svg>Арена</div>
  <div class="n-item" onclick="switchTab('other')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/></svg>Мисливець</div>
